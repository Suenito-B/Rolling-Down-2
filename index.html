function makePicker(row,d,i,mx){
 var bar=document.createElement('div');bar.className='dbtn pick d'+i;bar.tabIndex=0;bar.setAttribute('role','button');
 bar.innerHTML='<div class="pv"></div><div class="arr"><span class="au"></span><span class="ad"></span></div>';
 var pv=bar.querySelector('.pv'),au=bar.querySelector('.au'),ad=bar.querySelector('.ad');au.innerHTML=CHV.u;ad.innerHTML=CHV.d;
 var p={pos:mx,v:0,drag:false,raf:0,last:0,lastY:0,t0:0,moved:0,hist:[]};
 function cur(){return Math.round(Math.max(1,Math.min(mx,p.pos)))}
 function draw(){var c=Math.round(p.pos),h='';
  for(var n=Math.max(1,c-1);n<=Math.min(mx,c+1);n++)h+='<div style="transform:translateY('+((p.pos-n)*PH).toFixed(1)+'px)">'+d.n+' \u00b7 Island '+n+'</div>';
  pv.innerHTML=h;var sp=Math.abs(p.v);pv.style.filter=sp>8?'blur('+Math.min(2.5,sp/30).toFixed(1)+'px)':'';
  var cc=cur();au.style.visibility=cc<mx?'visible':'hidden';ad.style.visibility=cc>1?'visible':'hidden';
  bar.setAttribute('aria-label',d.n+', island '+cc+(cc<mx?', scroll down for later islands':'')+(cc>1?', scroll up for earlier islands':''))}
 function tick(now){var dt=Math.min(.05,(now-p.last)/1000);p.last=now;if(p.drag){p.raf=0;return}
  if(p.pos<1||p.pos>mx){var tg=p.pos<1?1:mx;p.v+=(-120*(p.pos-tg)-16*p.v)*dt;p.pos+=p.v*dt}
  else if(Math.abs(p.v)>3){p.v*=Math.exp(-dt*3.2);p.pos+=p.v*dt;if(p.pos<1||p.pos>mx)p.v*=.25}
  else{var t2=Math.round(p.pos);p.v+=(-160*(p.pos-t2)-22*p.v)*dt;p.pos+=p.v*dt;
   if(Math.abs(p.pos-t2)<.002&&Math.abs(p.v)<.05){p.pos=t2;p.v=0;draw();p.raf=0;return}}
  draw();p.raf=requestAnimationFrame(tick)}
 function go(){if(!p.raf){p.last=performance.now();p.raf=requestAnimationFrame(tick)}}
 function play(){sfx('ui');startGame(pickN,i,cur())}
 function end(e,ok){if(!p.drag)return;p.drag=false;var now=performance.now(),h=p.hist.filter(function(q){return now-q.t<110});
  if(h.length>1){var a=h[0],dtm=(now-a.t)/1000;if(dtm>.01)p.v=Math.max(-150,Math.min(150,((p.lastY-a.y)/PH)/dtm))}else p.v=0;
  if(ok&&p.moved<6&&now-p.t0<400){p.v=0;play();return}
  go()}
 bar.addEventListener('pointerdown',function(e){p.drag=true;p.v=0;p.lastY=e.clientY;p.moved=0;p.t0=performance.now();p.hist=[{t:p.t0,y:e.clientY}];try{bar.setPointerCapture(e.pointerId)}catch(x){}});
 bar.addEventListener('pointermove',function(e){if(!p.drag)return;var dy=e.clientY-p.lastY;p.lastY=e.clientY;p.moved+=Math.abs(dy);
  var dd=dy/PH;if((p.pos<1&&dd<0)||(p.pos>mx&&dd>0))dd*=.35;p.pos+=dd;var n=performance.now();p.hist.push({t:n,y:e.clientY});if(p.hist.length>12)p.hist.shift();draw()});
 bar.addEventListener('pointerup',function(e){end(e,true)});bar.addEventListener('pointercancel',function(e){end(e,false)});
 bar.addEventListener('wheel',function(e){e.preventDefault();p.v=Math.max(-150,Math.min(150,p.v-e.deltaY*.25));go()},{passive:false});
 bar.addEventListener('keydown',function(e){if(e.key=='Enter'||e.key==' '){e.preventDefault();play()}else if(e.key=='ArrowUp'){e.preventDefault();p.pos=Math.max(1,cur()-1);p.v=0;go()}else if(e.key=='ArrowDown'){e.preventDefault();p.pos=Math.min(mx,cur()+1);p.v=0;go()}});
 row.appendChild(bar);draw()}
function renderDiff(){var l=$('dlist');l.innerHTML='';
 DF.forEach(function(d,i){var row=document.createElement('div');row.className='drow';
  if(d.locked){var b=document.createElement('button');b.className='dbtn d'+i;b.disabled=true;b.setAttribute('aria-label',d.n+' (locked)');b.innerHTML='<span>'+d.n+'</span>'+LOCK;row.appendChild(b)}
  else makePicker(row,d,i,getMax(pickN,i));
  l.appendChild(row)})}
function buildMenu(){var c=$('cards');
 [[1,'Single ball',B1,'Beginner','One ball, one goal. Best for beginners.',''],[2,'Double ball',B2,'Challenge','Two balls, Two goals, rolling together.','ch']].forEach(function(m){
  var b=document.createElement('button');b.className='mcard';
  b.innerHTML='<h3>'+m[2]+m[1]+'<span class="badge '+m[5]+'">'+m[3]+'</span></h3><p>'+m[4]+'</p>';
  b.addEventListener('click',function(){sfx('ui');pickN=m[0];$('dsub').textContent=m[1];renderDiff();showScreen('diff')});c.appendChild(b)})}
function setSnd(){setIcon('bsd',MUTE?'sndOff':'sndOn',MUTE?'Sound off':'Sound on')}
function busy(){return mode!='plan'&&mode!='run'&&mode!='done'}
setIcon('bre','retry');setIcon('bgo','go');setIcon('bhm','home','Home');setIcon('bhelp','help','How to play');setIcon('bxr','ar','View in AR');setIcon('bpl','view','Place again');setSnd();
on('bgo',function(){if(!busy())release()});
on('bre',function(){if(busy())return;sfx('ui');retry()});
on('bhm',function(){sfx('ui');goMenu()});
on('bhelp',function(){sfx('ui');tutReplayStart()});
on('bpl',function(){sfx('ui');if(inAR){placed=false;scene.visible=false;$('arz').style.display='';$('bpl').style.display='none';toast('Point at a flat surface and tap to place',2000)}});
on('bsd',function(){MUTE=!MUTE;try{localStorage.setItem('rd-mute',MUTE?'1':'0')}catch(e){}audio();if(master)master.gain.value=MUTE?0:.7;setSnd();toast(MUTE?'Sound off':'Sound on',800)});
$('nxt').addEventListener('click',function(){sfx('ui');$('nxt').classList.remove('on');$('msg').classList.remove('on');if(lvl>=LVMAX)goMenu();else nextLevel()});
$('bstart').addEventListener('click',function(){sfx('ui');showScreen('menu');mode='menu'});
$('bback').addEventListener('click',function(){sfx('ui');showScreen('title');mode='title'});
$('bback2').addEventListener('click',function(){sfx('ui');showScreen('menu')});
['bar','bsd','bhm','bhelp','bxr','bpl','nxt','arz'].forEach(function(id){$(id).addEventListener('beforexrselect',function(e){e.preventDefault()})});
on('bxr',function(){sfx('ui');if(inAR){var ss=ren.xr.getSession();if(ss)ss.end();return}
 if(!(mode=='plan'||mode=='run'||mode=='done')){toast('Wait for the island to land',1200);return}
 if(!window.isSecureContext)toast('AR needs a secure (https) page',2600);else if(!navigator.xr)toast('AR needs Chrome on Android',2600);else startAR()});
buildMenu();mode='title';titleScene();showScreen('title');ren.setAnimationLoop(function(t,xf){xrF=xf;frame(t)});
window.__rel=function(){release()};window.__frame=frame;

})();
</script></body></html>
